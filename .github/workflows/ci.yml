name: CI

on:
  push:
    branches: [main, personal, codex/jose-personal-os]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    name: Shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Fetch the pinned Hermes Agent snapshot
        run: npm run sync-upstream
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  bridge:
    name: Bridge plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest pyyaml
      - name: pytest
        run: HERALD_OS_PYTHON="$(command -v python)" bash scripts/test-bridge.sh

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse every bash and Python script
        run: |
          failed=0
          while IFS= read -r file; do
            case "$(head -n 1 "$file")" in
              '#!'*bash*) bash -n "$file" || failed=1 ;;
              '#!'*python*) python3 -m py_compile "$file" || failed=1 ;;
            esac
          done < <(git ls-files)
          exit "$failed"

  personal:
    name: Personal API and Hermes tools (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --require-hashes -r services/personal/requirements.lock
      - name: API behavior and coverage
        working-directory: services/personal
        run: python -m pytest --cov=herald_personal --cov-report=term-missing
      - name: API static checks
        working-directory: services/personal
        run: |
          python -m ruff check herald_personal tests
          python -m mypy herald_personal
      - name: MCP and durable supervision
        env:
          PYTHONPATH: integrations/hermes-personal/src
        run: python -m unittest discover -s integrations/hermes-personal/tests -v
      - name: Runtime setup
        run: |
          python scripts/test_personal_runtime.py
          python scripts/test_install_personal_macos.py

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
