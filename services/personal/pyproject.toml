[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "herald-personal"
version = "0.1.0"
description = "Authenticated personal commitments, check-ins and bounded inbox service for Herald OS"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "uvicorn>=0.34,<1",
  "msal>=1.34,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "mypy>=1.15,<3", "ruff>=0.11,<1"]

[project.scripts]
herald-personal = "herald_personal.__main__:main"

[tool.setuptools.packages.find]
include = ["herald_personal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["herald_personal"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["herald_personal"]

[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true
